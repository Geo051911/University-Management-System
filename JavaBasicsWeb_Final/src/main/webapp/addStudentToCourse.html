<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student to Course</title>

    <link rel="stylesheet"
          href="style.css?v=9">

</head>


<body>

<div class="container portal-page secretary-page">

    <div class="page-header">

        <div class="page-heading">

            <div class="page-kicker">
                Administration
            </div>

            <h1>Add Student to Course</h1>

            <p>
                Enroll an existing student
                into an existing course.
            </p>

        </div>

        <div class="page-icon">
            🔗
        </div>

    </div>


    <div class="admin-form-card">

        <div class="admin-form-intro">

            <div class="admin-form-icon">
                ➕
            </div>

            <div>

                <strong>
                    Course Enrollment
                </strong>

                <span>
                    Enter the student's registration
                    number and the target course code.
                </span>

            </div>

        </div>


        <form action="add-student-course"
              method="post">

            <div class="form-grid">


                <div class="form-field">

                    <label for="registrationNumber">
                        Registration Number
                    </label>

                    <input type="number"
                           id="registrationNumber"
                           name="registrationNumber"
                           min="1"
                           step="1"
                           placeholder="e.g. 260101"
                           data-range-message="Registration number must be a positive whole number."
                           required>

                </div>


                <div class="form-field">

                    <label for="courseCode">
                        Course Code
                    </label>

                    <input type="text"
                           id="courseCode"
                           name="courseCode"
                           maxlength="20"
                           placeholder="e.g. CS102"
                           required>

                    <span class="field-hint">
                        Enter the existing course code.
                    </span>

                </div>


            </div>


            <button class="admin-submit"
                    type="submit">

                Add Student to Course

            </button>

        </form>

    </div>


    <div class="page-actions">

        <a class="secondary-action"
           href="secretaryMenu.jsp">

            ← Back to Administration Dashboard

        </a>

    </div>

</div>


<script src="ui.js?v=9"></script>

</body>

</html>
