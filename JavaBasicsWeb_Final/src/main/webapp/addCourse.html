<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Course</title>

    <link rel="stylesheet"
          href="style.css?v=9">

</head>


<body>

<div class="container portal-page secretary-page">

    <div class="page-header">

        <div class="page-heading">

            <div class="page-kicker">
                Administration
            </div>

            <h1>Add Course</h1>

            <p>
                Create a new course
                in the university curriculum.
            </p>

        </div>

        <div class="page-icon">
            📚
        </div>

    </div>


    <div class="admin-form-card">

        <div class="admin-form-intro">

            <div class="admin-form-icon">
                📘
            </div>

            <div>

                <strong>
                    Course Information
                </strong>

                <span>
                    Define the course code,
                    title and semester.
                </span>

            </div>

        </div>


        <form action="add-course"
              method="post">

            <div class="form-grid">


                <div class="form-field">

                    <label for="courseCode">
                        Course Code
                    </label>

                    <input type="text"
       					id="courseCode"
       					name="courseCode"
       					maxlength="20"
       					pattern="[A-Z]+[0-9]+"
       					placeholder="e.g. CS115"
       					data-pattern-message="Course code must contain uppercase letters followed by numbers, without spaces. Example: CS115."
       				required>

<span class="field-hint">
    Uppercase letters followed by numbers, without spaces. Example: CS115.
</span>

                    <span class="field-hint">
                        Letters and numbers are allowed.
                    </span>

                </div>


                <div class="form-field">

                    <label for="semester">
                        Semester
                    </label>

                    <input type="number"
                           id="semester"
                           name="semester"
                           min="1"
                           step="1"
                           placeholder="e.g. 6"
                           data-range-message="Semester must be greater than 0."
                           required>

                </div>


                <div class="form-field form-field-full">

                    <label for="courseName">
                        Course Name
                    </label>

                    <input type="text"
                           id="courseName"
                           name="courseName"
                           placeholder="e.g. Advanced Software Engineering"
                           required>

                </div>


            </div>


            <button class="admin-submit"
                    type="submit">

                Create Course

            </button>

        </form>

    </div>


    <div class="page-actions">

        <a class="secondary-action"
           href="secretaryMenu.jsp">

            ← Back to Administration Dashboard

        </a>

    </div>

</div>


<script src="ui.js?v=9"></script>

</body>

</html>
