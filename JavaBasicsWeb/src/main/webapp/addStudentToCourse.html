<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Add Student to Course</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Add Student to Course</h1>

        <form action="add-student-course" method="post">

            Registration Number:
            <input type="number"
                   name="registrationNumber"
                   step="1"
                   required>

            Course Code:
            <input type="text"
                   name="courseCode"
                   maxlength="20"
                   required>

            <input type="submit" value="Add Student to Course">

        </form>

        <a href="index.html">&larr; Back to Home</a>

    </div>

</body>

</html>
