<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Assign Professor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Assign Professor to Course</h1>

        <form action="assign-professor" method="post">

            Course Code:

            <input type="text"
                   name="courseCode"
                   maxlength="20"
                   required>

            Professor Number:

            <input type="number"
                   name="professorNumber"
                   step="1"
                   required>

            <input type="submit"
                   value="Assign Professor">

        </form>

        <a href="secretaryMenu.html">
            &larr; Back to Secretary Menu
        </a>

    </div>

</body>

</html>
