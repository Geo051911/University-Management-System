<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Add Course</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Add Course</h1>

    <form action="add-course" method="post">

        <label>Course Code</label>
        <input type="text"
               name="courseCode"
               required>

        <label>Course Name</label>
        <input type="text"
               name="courseName"
               required>

        <label>Semester</label>
        <input type="number"
               name="semester"
               min="1"
               required>

        <button type="submit">
            Add Course
        </button>

    </form>

    <a href="secretaryMenu.jsp">
        Back to Secretary Menu
    </a>

</div>

</body>
</html>
