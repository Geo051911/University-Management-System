<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Add Professor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Add Professor</h1>

        <form action="add-professor" method="post">

            Username:
            <input type="text"
                   name="username"
                   maxlength="50"
                   required>

            Name:
            <input type="text"
                   name="name"
                   maxlength="50"
                   required>

            Surname:
            <input type="text"
                   name="surname"
                   maxlength="50"
                   required>

            Department:
            <input type="text"
                   name="department"
                   maxlength="100"
                   required>

            Professor Number:
            <input type="number"
                   name="professorNumber"
                   step="1"
                   required>

            <input type="submit" value="Add Professor">

        </form>

        <a href="index.html">&larr; Back to Home</a>

    </div>

</body>

</html>
